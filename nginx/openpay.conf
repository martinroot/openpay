server {
    listen 80;
    server_name openpay.click www.openpay.click;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    # VibeMetrics tracker
    sub_filter '</body>' '<script defer src="https://vibemetrics.click/tracker.js" data-site-id="openpay-click" data-site-key="<VIBEMETRICS_SITE_KEY>"></script></body>';
    sub_filter_once on;
    sub_filter_types text/html;
    gzip off;
    proxy_set_header Accept-Encoding "";
    server_name openpay.click www.openpay.click;

    ssl_certificate /etc/letsencrypt/live/openpay.click/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openpay.click/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    client_max_body_size 128m;
    root /var/www/openpay.click;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
    proxy_read_timeout 90s;
    proxy_send_timeout 90s;

    # Temporary gate: only the operator can claim the initial root account.
    location ^~ /api/v1/dv-admin/auth/register {
        auth_basic "OpenPay initial setup";
        auth_basic_user_file /etc/nginx/.htpasswd-openpay;
        proxy_pass http://127.0.0.1:18081;
    }

    location ~ /\.(ht|svn|git) { deny all; }
    location = / {
        try_files /index.html =404;
    }
    location = /integration.md {
        default_type text/markdown;
        try_files $uri =404;
    }
    # DV external API: только с IP сайтов, которым выданы ключи
    # self-service key delivery: файл читает только IP сайта
    location = /onboard/gitgame.env {
        allow 167.172.183.157;
        deny all;
    }
    # onboard openmvp: env читает только IP сайта
    location = /onboard/openmvp.env {
        allow 5.144.179.170;
        deny all;
    }
    # onboard GitGame: env читает только IP сайта
    location = /onboard/GitGame.env {
        allow 167.172.183.157;
        deny all;
    }
    # onboard gsb: env читает только IP сайта
    location = /onboard/gsb.env {
        allow 146.103.41.33;
        deny all;
    }
    location = /api/v1/external/wallet {
        allow 146.103.41.33;
        allow 5.144.179.170;
        allow 167.172.183.157;
        allow 127.0.0.1;
        deny all;
        proxy_pass http://127.0.0.1:18081;
    }
    location ^~ /assets/ {
        try_files $uri =404;
    }
    # Self-service onboarding + sandbox API (IP-locked)
    location /api/v1/onboard/ {
        allow 146.103.41.33;
        allow 5.144.179.170;
        allow 167.172.183.157;
        allow 127.0.0.1;
        deny all;
        proxy_pass http://127.0.0.1:18082;
    }
    # Ops log: UI with basic auth, agent writes IP-locked
    location /ops/log/ {
        allow 146.103.41.33;
        allow 167.172.183.157;
        allow 127.0.0.1;
        deny all;
        proxy_pass http://127.0.0.1:18083/api/;
    }
    location /ops/ {
        auth_basic "OpenPay Ops";
        auth_basic_user_file /etc/nginx/.ops.htpasswd;
        proxy_pass http://127.0.0.1:18083/;
    }
    # DV build has no blocked-transactions endpoint; stub empty list to avoid UI error toasts
    location ~ ^/api/v1/public/wallet/[^/]+/blocked-transactions$ {
        default_type application/json;
        return 200 '{"code":200,"message":"ok","data":[]}';
    }
    location / { proxy_pass http://127.0.0.1:18081; }
}
